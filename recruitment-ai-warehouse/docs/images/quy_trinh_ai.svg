<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="430" viewBox="0 0 1560 430" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8984"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="780" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle" style="">Quy trình AI có kiểm duyệt và chống thiên vị (human-in-the-loop)</text><rect x="22" y="80" width="196" height="120" rx="10" fill="#fff" stroke="#8a8984" stroke-width="1.5"/><text x="34" y="104" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start" style="">CV / hồ sơ</text><text x="34" y="125" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">PDF, DOCX, TXT</text><text x="34" y="144" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">hoặc dữ liệu kho</text><path d="M 218,140 L 238,140" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="240" y="80" width="196" height="120" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="252" y="104" font-size="14" font-weight="700" fill="#184f95" text-anchor="start" style="">Trích văn bản</text><text x="252" y="125" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">pypdf, python-docx,</text><text x="252" y="144" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">tách mục CV</text><path d="M 436,140 L 456,140" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="458" y="80" width="196" height="120" rx="10" fill="#fdf0ea" stroke="#d95926" stroke-width="1.5"/><text x="470" y="104" font-size="14" font-weight="700" fill="#8a3a17" text-anchor="start" style="">Ẩn danh hoá</text><text x="470" y="125" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">bỏ tên, email, SĐT, ngày</text><text x="470" y="144" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">sinh, giới tính, hôn nhân,</text><text x="470" y="163" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">địa chỉ, tôn giáo…</text><path d="M 654,140 L 674,140" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="676" y="80" width="196" height="120" rx="10" fill="#efedfb" stroke="#5544c4" stroke-width="1.5"/><text x="688" y="104" font-size="14" font-weight="700" fill="#5544c4" text-anchor="start" style="">AI engine</text><text x="688" y="125" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Claude (JSON Schema)</text><text x="688" y="144" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">hoặc NLP nội bộ</text><text x="688" y="163" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">– không chấm điểm người</text><path d="M 872,140 L 892,140" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="894" y="80" width="196" height="120" rx="10" fill="#fdf0ea" stroke="#d95926" stroke-width="1.5"/><text x="906" y="104" font-size="14" font-weight="700" fill="#8a3a17" text-anchor="start" style="">Bias guard</text><text x="906" y="125" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">quét nội dung theo 7</text><text x="906" y="144" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">nhóm thuộc tính</text><text x="906" y="163" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">được bảo vệ → gắn cờ</text><path d="M 1090,140 L 1110,140" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1112" y="80" width="196" height="120" rx="10" fill="#f4f4f1" stroke="#a9a8a2" stroke-width="1.5"/><text x="1124" y="104" font-size="14" font-weight="700" fill="#3d3c39" text-anchor="start" style="">Chờ duyệt</text><text x="1124" y="125" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">ai_insight.status =</text><text x="1124" y="144" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">pending_review</text><path d="M 1308,140 L 1328,140" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1330" y="80" width="196" height="120" rx="10" fill="#e8f6ef" stroke="#0e7a4f" stroke-width="1.5"/><text x="1342" y="104" font-size="14" font-weight="700" fill="#0e7a4f" text-anchor="start" style="">HR kiểm duyệt</text><text x="1342" y="125" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">duyệt / sửa / từ chối;</text><text x="1342" y="144" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">cờ thiên vị bắt buộc</text><text x="1342" y="163" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">ghi chú</text><path d="M 1428.0,200 L 1428.0,262" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1468.0" y="236" font-size="12" font-weight="500" fill="#6b6a66" text-anchor="middle" style="">đã duyệt</text><rect x="1218.0" y="264" width="300" height="92" rx="10" fill="#fff" stroke="#0e7a4f" stroke-width="1.5"/><text x="1230.0" y="288" font-size="14" font-weight="700" fill="#0e7a4f" text-anchor="start" style="">Hiring manager</text><text x="1230.0" y="309" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">chỉ xem nhận xét đã duyệt,</text><text x="1230.0" y="328" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">thông tin ứng viên đã che</text><rect x="22" y="264" width="640" height="140" rx="10" fill="#f4f4f1" stroke="#8a8984" stroke-width="1.5"/><text x="34" y="288" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start" style="">Kiểm soát đi kèm</text><text x="34" y="309" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">• Độ phủ kỹ năng JD tính bằng từ điển (nhất quán, giải thích được) – chỉ tham khảo</text><text x="34" y="328" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">• Nhận xét phỏng vấn của con người cũng được quét thiên vị trước khi lưu</text><text x="34" y="347" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">• Giám sát tỷ lệ qua vòng theo giới tính – quy tắc 4/5 (impact ratio ≥ 0,8)</text><text x="34" y="366" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">• Nhật ký audit: ai chạy AI, ai duyệt, ai xem thông tin cá nhân</text><rect x="700" y="264" width="420" height="140" rx="10" fill="#fff" stroke="#8a8984" stroke-width="1.5"/><text x="712" y="288" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start" style="">Dự phòng</text><text x="712" y="309" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">• Không có API key / Claude lỗi → engine NLP nội bộ</text><text x="712" y="328" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">• Claude từ chối → server-side fallback</text><text x="712" y="347" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">• Mọi kết quả đều lưu provider, model, phiên bản prompt</text></svg>
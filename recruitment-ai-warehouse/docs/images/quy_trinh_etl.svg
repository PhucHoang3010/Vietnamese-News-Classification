<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="470" viewBox="0 0 1560 470" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8984"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="780" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle" style="">Quy trình ETL đa nguồn và khử trùng ứng viên</text><rect x="22" y="90" width="196" height="132" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="34" y="114" font-size="14" font-weight="700" fill="#184f95" text-anchor="start" style="">1. Extract</text><text x="34" y="135" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Đọc CSV, JSON, XLSX</text><text x="34" y="154" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">(tự dò dòng tiêu đề),</text><text x="34" y="173" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">.eml + CV đính kèm</text><path d="M 218,156 L 238,156" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="240" y="90" width="196" height="132" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="252" y="114" font-size="14" font-weight="700" fill="#184f95" text-anchor="start" style="">2. Staging</text><text x="252" y="135" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Lưu bản ghi thô +</text><text x="252" y="154" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">vân tay SHA-256;</text><text x="252" y="173" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">bỏ qua bản ghi đã nạp</text><path d="M 436,156 L 456,156" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="458" y="90" width="196" height="132" rx="10" fill="#fdf0ea" stroke="#d95926" stroke-width="1.5"/><text x="470" y="114" font-size="14" font-weight="700" fill="#8a3a17" text-anchor="start" style="">3. Transform</text><text x="470" y="135" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Chuẩn hoá tên, email,</text><text x="470" y="154" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">SĐT (0xxxxxxxxx), ngày,</text><text x="470" y="173" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">vị trí/nguồn/vòng/trạng thái</text><path d="M 654,156 L 674,156" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="676" y="90" width="196" height="132" rx="10" fill="#fdf0ea" stroke="#d95926" stroke-width="1.5"/><text x="688" y="114" font-size="14" font-weight="700" fill="#8a3a17" text-anchor="start" style="">4. Validate</text><text x="688" y="135" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Bắt buộc: họ tên,</text><text x="688" y="154" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">email hoặc SĐT, vị trí,</text><text x="688" y="173" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">ngày nộp hợp lệ</text><path d="M 872,156 L 892,156" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="894" y="90" width="196" height="132" rx="10" fill="#fdf0ea" stroke="#d95926" stroke-width="1.5"/><text x="906" y="114" font-size="14" font-weight="700" fill="#8a3a17" text-anchor="start" style="">5. Định danh</text><text x="906" y="135" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Khớp email → SĐT →</text><text x="906" y="154" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">họ tên + ngày sinh;</text><text x="906" y="173" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">gộp thông tin thiếu</text><path d="M 1090,156 L 1110,156" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1112" y="90" width="196" height="132" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="1124" y="114" font-size="14" font-weight="700" fill="#184f95" text-anchor="start" style="">6. Load</text><text x="1124" y="135" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Upsert dim_*, gộp hồ sơ</text><text x="1124" y="154" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">(ứng viên, vị trí) duy nhất,</text><text x="1124" y="173" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">gộp sự kiện từng vòng</text><path d="M 1308,156 L 1328,156" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1330" y="90" width="196" height="132" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="1342" y="114" font-size="14" font-weight="700" fill="#184f95" text-anchor="start" style="">7. Hậu xử lý</text><text x="1342" y="135" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Thời lượng vòng, vòng</text><text x="1342" y="154" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">hiện tại, kỹ năng (NLP),</text><text x="1342" y="173" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">lý do rớt, cờ thiên vị</text><path d="M 774.0,222 L 774.0,300" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><text x="826.0" y="272" font-size="12" font-weight="500" fill="#6b6a66" text-anchor="middle" style="">không hợp lệ</text><rect x="624.0" y="302" width="300" height="74" rx="10" fill="#fff6f1" stroke="#d95926" stroke-width="1.5"/><text x="636.0" y="326" font-size="14" font-weight="700" fill="#8a3a17" text-anchor="start" style="">Bản ghi bị loại</text><text x="636.0" y="347" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">stg_raw_record.status = &#x27;rejected&#x27;</text><text x="636.0" y="366" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">+ lý do, hiển thị trên web</text><rect x="1100" y="302" width="438" height="136" rx="10" fill="#f4f4f1" stroke="#8a8984" stroke-width="1.5"/><text x="1112" y="326" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start" style="">etl_run – nhật ký mỗi lần chạy</text><text x="1112" y="347" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">START / EXTRACT / TRANSFORM / LOAD / NLP / DONE</text><text x="1112" y="366" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Số bản ghi: thô, hợp lệ, bị loại, bỏ qua (đã nạp)</text><text x="1112" y="385" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Ứng viên mới, bản ghi trùng đã gộp (theo email/SĐT/…)</text><text x="1112" y="404" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">Trạng thái: success · partial · failed</text><path d="M 1428.0,222 L 1428.0,300" fill="none" stroke="#8a8984" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="302" width="420" height="136" rx="10" fill="#fff" stroke="#8a8984" stroke-width="1.5"/><text x="34" y="326" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start" style="">Ví dụ dữ liệu bẩn được làm sạch</text><text x="34" y="347" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">&#x27;+84 912 345 678&#x27;, &#x27;912345678&#x27; → 0912345678</text><text x="34" y="366" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">&#x27;NGUYEN VAN AN&#x27; ↔ &#x27;Nguyễn Văn An&#x27; (cùng email)</text><text x="34" y="385" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">&#x27;DA&#x27;, &#x27;Data analyst (Junior)&#x27; → DA-2026</text><text x="34" y="404" font-size="13" font-weight="400" fill="#3d3c39" text-anchor="start" style="">&#x27;topcv.vn&#x27;, &#x27;Top CV&#x27; → TOPCV</text></svg>
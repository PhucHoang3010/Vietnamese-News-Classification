services:
  postgres:
    image: postgres:16
    container_name: vietnamese-news-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - news-network

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vietnamese-news-api
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      PYTHONPATH: /app
      CRAWLER_CONTROL_URL: http://crawler:9000
      CRAWLER_CONTROL_TOKEN: ${CRAWLER_CONTROL_TOKEN}

    volumes:
      - ./data:/app/data

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - news-network

  crawler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vietnamese-news-crawler
    restart: unless-stopped

    command:
      [
        "python",
        "-m",
        "src.crawler.main"
      ]

    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      PREDICTION_API_URL: ${PREDICTION_API_URL}
      CRAWL_INTERVAL_SECONDS: ${CRAWL_INTERVAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      PYTHONPATH: /app
      CRAWLER_CONTROL_TOKEN: ${CRAWLER_CONTROL_TOKEN}

    depends_on:
      fastapi:
        condition: service_healthy

    networks:
      - news-network

volumes:
  pgdata:

networks:
  news-network:
    driver: bridge

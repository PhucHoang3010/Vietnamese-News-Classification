<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mô phỏng xung đột đăng kí học phần</title>
  <link rel="stylesheet" href="mo-phong.css">
</head>
<body>
  <header class="dau">
    <div class="wrap dau-trong">
      <div>
        <h1>Xung đột dữ liệu khi đăng kí học phần</h1>
      </div>
      <a class="link-nho" href="/day-du.html">Trang đăng kí đầy đủ →</a>
    </div>
  </header>

  <main class="wrap">
    <nav class="tab" id="tab" aria-label="Chọn trường hợp"></nav>

    <section class="san-khau">
      <p class="cau-chuyen" id="cau-chuyen"></p>
      <div class="ba-cot">
        <div class="ban" id="ban-A"></div>
        <div class="giua" id="giua" aria-live="polite"></div>
        <div class="ban" id="ban-B"></div>
      </div>
      <div class="nut-chay">
        <button type="button" class="chay sai" id="chay-khong">▶ Chạy khi CHƯA xử lý</button>
        <button type="button" class="chay dung" id="chay-co">▶ Chạy khi ĐÃ xử lý</button>
      </div>
    </section>

    <section class="ket-luan" id="ket-luan" hidden aria-live="polite"></section>

    <section class="o" id="sau-khi-chay" hidden>
      <h2>Diễn biến</h2>
      <ol class="chat" id="dien-bien"></ol>
    </section>
  </main>

  <script src="mo-phong.js"></script>
</body>
</html>
